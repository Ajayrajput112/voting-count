<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vote Battle</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111;overflow:hidden;user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:8px;background:#111;color:#fff;font-size:14px}
#bar button{background:#fff;color:#111;border:0;border-radius:20px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
#bar button.off{opacity:.5}
#goal{width:76px;border-radius:8px;border:0;padding:8px;font-size:14px;font-weight:700;text-align:center}
#sides{flex:1;display:flex;min-height:0}
.side{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .2s;padding:12px;text-align:center}
.side.lead::before{content:"👑 Leading";position:absolute;top:8px;font-size:13px;font-weight:700;background:rgba(0,0,0,.3);color:#fff;padding:3px 10px;border-radius:12px}
.name{width:90%;max-width:280px;font-size:clamp(20px,4vw,30px);font-weight:800;text-align:center;background:rgba(255,255,255,.2);border:2px dashed currentColor;border-radius:10px;padding:8px;color:inherit;outline:none}
.count{font-size:clamp(60px,18vw,150px);font-weight:900;line-height:1;transition:transform .08s}
.count.bump{transform:scale(1.12)}
.sub{font-size:14px;opacity:.85}
.prog{width:80%;max-width:280px;height:10px;border-radius:5px;background:rgba(0,0,0,.25);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:currentColor;transition:width .15s}
.color{display:flex;align-items:center;gap:6px;font-size:13px}
.color input{width:48px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.plus{position:absolute;font-weight:900;font-size:28px;pointer-events:none;animation:up .7s forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.7);color:#fff;z-index:5;cursor:default;animation:pop .5s}
.side.won .win{display:flex}
.trophy{font-size:clamp(90px,25vw,180px);animation:bounce 1s infinite}
.win h2{margin:0;font-size:clamp(24px,5vw,40px)}
.win button{margin-top:14px;background:#fff;color:#111;border:0;border-radius:20px;padding:10px 22px;font-weight:700;font-size:15px;cursor:pointer}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes bounce{50%{transform:translateY(-14px) rotate(6deg)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
@media(max-width:700px) and (orientation:portrait){#sides{flex-direction:column}.side{gap:5px;padding:8px}.count{font-size:clamp(56px,20vw,110px)}.sub{font-size:12px}}
@media(max-height:480px) and (orientation:landscape){.side{gap:3px;padding:6px}.count{font-size:20vh}.sub{display:none}.name{font-size:16px;padding:4px}}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div id="app">
  <div id="bar">
    <label>🎯 Goal <input id="goal" type="number" min="1" max="100000" value="1000" inputmode="numeric"></label>
    <button id="undo">↶ Undo</button>
    <button id="snd">🔊 Sound</button>
    <button id="fs">⛶ Full</button>
    <button id="reset">↺ Reset</button>
  </div>
  <div id="sides">
    <div class="side" id="s0">
      <input class="name" value="Team A" maxlength="20">
      <div class="count">0</div><div class="sub">0%</div>
      <div class="prog"><i></i></div>
      <label class="color">Color <input type="color" value="#e63946"></label>
      <div class="win"><div class="trophy">🏆</div><h2></h2><div>is the winner!</div><button class="again">Play again</button></div>
    </div>
    <div class="side" id="s1">
      <input class="name" value="Team B" maxlength="20">
      <div class="count">0</div><div class="sub">0%</div>
      <div class="prog"><i></i></div>
      <label class="color">Color <input type="color" value="#1d7bd8"></label>
      <div class="win"><div class="trophy">🏆</div><h2></h2><div>is the winner!</div><button class="again">Play again</button></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s), sides=[...document.querySelectorAll('.side')];
let votes=[0,0], over=false, sound=true, history=[], MAX=1000, ac=null;
const goalEl=$('#goal');
function save(){try{localStorage.setItem('vb',JSON.stringify({votes,MAX,sound,over,n:sides.map(s=>s.querySelector('.name').value),c:sides.map(s=>s.querySelector('input[type=color]').value)}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('vb')||'null');if(!d)return;votes=d.votes;MAX=d.MAX;sound=d.sound;over=d.over;sides.forEach((s,i)=>{s.querySelector('.name').value=d.n[i];s.querySelector('input[type=color]').value=d.c[i]})}catch(e){}}
function textOn(h){const n=parseInt(h.slice(1),16);return(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))>150?'#111':'#fff'}
function beep(f,d){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function render(){
  goalEl.value=MAX;$('#snd').textContent=sound?'🔊 Sound':'🔇 Muted';$('#snd').classList.toggle('off',!sound);
  const lead=votes[0]===votes[1]?-1:(votes[0]>votes[1]?0:1);
  sides.forEach((s,i)=>{
    const c=s.querySelector('input[type=color]').value;s.style.background=c;s.style.color=textOn(c);
    s.querySelector('.count').textContent=votes[i];
    const p=Math.min(100,votes[i]/MAX*100);
    s.querySelector('.prog i').style.width=p+'%';
    s.querySelector('.sub').textContent=Math.round(p)+'% of '+MAX;
    s.classList.toggle('lead',lead===i&&votes[i]>0&&!over);
    s.classList.toggle('won',over&&votes[i]>=MAX);
    s.querySelector('.win h2').textContent=s.querySelector('.name').value||'Winner';
  });
}
function confetti(){
  const cv=$('#cf'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*200,vy:3+Math.random()*4,vx:(Math.random()-.5)*3,c:`hsl(${Math.random()*360},90%,60%)`,s:5+Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++t<220)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})();
}
sides.forEach((s,i)=>{
  s.addEventListener('click',e=>{
    if(over||e.target.closest('input,label,.win'))return;
    votes[i]++;history.push(i);
    const r=s.getBoundingClientRect(),p=document.createElement('div');p.className='plus';p.textContent='+1';p.style.left=(e.clientX-r.left-12)+'px';p.style.top=(e.clientY-r.top-20)+'px';s.appendChild(p);setTimeout(()=>p.remove(),700);
    const ct=s.querySelector('.count');ct.classList.add('bump');setTimeout(()=>ct.classList.remove('bump'),80);
    if(navigator.vibrate)navigator.vibrate(15);
    if(votes[i]>=MAX){over=true;beep(880,.5);confetti();if(navigator.vibrate)navigator.vibrate([100,50,200])}else beep(i?520:440,.06);
    render();save();
  });
  s.querySelector('input[type=color]').addEventListener('input',()=>{render();save()});
  s.querySelector('.name').addEventListener('input',()=>{render();save()});
  s.querySelector('.again').onclick=reset;
});
function reset(){votes=[0,0];over=false;history=[];render();save()}
$('#reset').onclick=()=>{if(votes[0]+votes[1]===0||confirm('Reset all votes to 0?'))reset()};
$('#undo').onclick=()=>{if(over||!history.length)return;votes[history.pop()]--;render();save()};
$('#snd').onclick=()=>{sound=!sound;render();save()};
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
goalEl.addEventListener('change',()=>{const v=Math.max(1,parseInt(goalEl.value)||1000);if(over||Math.max(...votes)>=v){alert('Reset first, then change the goal.');goalEl.value=MAX;return}MAX=v;render();save()});
load();render();
</script>
</body>
</html>
